<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Schedule Table</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: "Times New Roman", Times, serif;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px 12px;
        }
        th {
            text-align: center;
        }
        .nested-table {
            width: 100%;
            border-collapse: collapse;
        }
        .nested-table th, .nested-table td {
            border: 1px solid #777;
            padding: 6px 10px;
            text-align: left;
        }
        .nested-table th {
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Friday</td>
                <td>
                    <table class="nested-table">
                        <thead>
                            <tr>
                                <th>Batch</th>
                                <th>System</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>A1</td>
                                <td>PC 1-20</td>
                            </tr>
                            <tr>
                                <td>A2</td>
                                <td>PC 21-40</td>
                            </tr>
                        </tbody>
                    </table>
                </td>
                <td>Dr. Sharma</td>
                <td>Lab 2</td>
                <td>2-4 PM</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
