<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17</title>
</head>
<body>
    <fieldset>

        <input type="text" name="name" id="name"
        placeholder="Enter your name" required
        pattern="[A-Za-z]+">

        <br><br>

        <input type="email"
        placeholder="you@college.edu" required>

        <br><br>

        <input type="tel"
        placeholder="10-digit mobile" pattern="[0-9]{10}" required>

        <br><br>

        <input type="password"
        placeholder="Min 6 characters" minlength="6" required>

        <br><br>

        <input type="number"
        placeholder="Age" min="17" max="30" required>
    

    <br><br>

    <input type="password"
    placeholder="Min 6 characters" minlength="6" required>

    <br><br>

    <input type="number"
    placeholder="Age" min="17" max="30" required>

    <br><br>

    <input type="submit" value="Register">

</fieldset>
